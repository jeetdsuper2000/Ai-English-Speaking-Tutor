              <div class="meta">${esc(m.explanation || "")} · ${fmtClock(m.createdAt)}</div></div>
          </div>`).join("") : `<div class="empty"><span class="em">✨</span>No mistakes recorded yet.</div>`}
        ${recentMistakes.length ? `<a href="#/mistakes" class="btn btn-ghost btn-sm" style="width:100%;margin-top:16px">See all mistakes</a>` : ""}
      </div>
      <div class="panel"><h2>🕘 Recent sessions</h2>
        ${recentSessions.length ? recentSessions.map(s => `<div class="mistake-item">
            <span class="cat">${esc(s.level.split(" ")[0])}</span>
            <div class="body"><div style="font-weight:600;font-size:14.5px">${esc(s.scenarioName)}</div>
              <div class="meta">${fmtDur(s.duration)} · ${s.turnCount} turns · ${fmtClock(s.startedAt)}</div></div>
            ${s.scores ? `<div style="font-weight:750;font-size:16px;color:${s.scores.grammar >= 75 ? "var(--ok)" : s.scores.grammar >= 55 ? "var(--warn)" : "var(--bad)"}">${s.scores.grammar}</div>` : ""}
          </div>`).join("") : `<div class="empty"><span class="em">🎙️</span>Your sessions will appear here.</div>`}
      </div>
    </div>
    <div class="panel" style="margin-top:22px">
      <h2>💬 Jump into a scenario</h2>
      <div class="chips">${SCENARIOS.map(s => `<a href="#/tutor?scenario=${s.id}" class="chip">${s.icon} ${esc(s.name)}</a>`).join("")}</div>
    </div>
  </div>`;
}

/* ========================= 14. PROGRESS ========================= */
function renderProgress() {
  const t = Stats.totals();
  const avg = Stats.averages();
  const { byCategory, recurring } = Stats.mistakeBreakdown();
  const sessions = Repo.getSessions();
  const maxCat = byCategory.length ? byCategory[0][1] : 1;

  $("#app").innerHTML = `
  <div class="wrap">
    <div class="dash-head"><h1>Your progress</h1>
      <p>Real numbers from your actual sessions.</p></div>
    <div class="grid g4" style="margin-top:22px">
      <div class="stat"><div class="k">Total speaking</div><div class="v">${fmtDur(t.totalSec)}</div><div class="sub">across ${t.sessions} sessions</div></div>
      <div class="stat"><div class="k">Words spoken</div><div class="v">${t.totalWords.toLocaleString()}</div><div class="sub">${t.sessions ? Math.round(t.totalWords / t.sessions) : 0} per session</div></div>
      <div class="stat"><div class="k">Current streak</div><div class="v">${Stats.streak()} <span style="font-size:15px;font-weight:600;color:var(--muted)">days</span></div><div class="sub">${Stats.streak() > 0 ? "Active" : "Start today"}</div></div>
      <div class="stat"><div class="k">Corrections</div><div class="v">${Repo.getMistakes().length}</div><div class="sub">total recorded</div></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:22px">
      <div class="panel"><h2>📊 Skill breakdown</h2>
        ${avg ? Object.entries({
          grammar: ["Grammar", "Tenses, articles, agreement, prepositions"],
          vocabulary: ["Vocabulary", "Range and variety of words you use"],
          fluency: ["Fluency", "Words per minute, hesitation, pace"],
          confidence: ["Confidence", "Estimated from clean turns and session frequency"],
          pronunciation: ["Pronunciation", "From your browser's speech confidence — best effort"]
        }).map(([k, [label, desc]]) => {
          const v = avg[k];
          return `<div class="bar-row"><div class="bar-top">
              <span class="n">${label} <span style="color:var(--dim);font-size:12px">— ${desc}</span></span>
              <span class="v">${v == null ? "—" : v}</span></div>
            <div class="bar"><i class="${v == null ? "" : v >= 75 ? "g" : v >= 55 ? "" : "w"}" style="width:${v == null ? 0 : v}%"></i></div></div>`;
        }).join("") : `<div class="empty"><span class="em">📈</span>Complete at least one session to see your skill breakdown.</div>`}
      </div>
      <div class="panel"><h2>🔍 Mistakes by category</h2>
        ${byCategory.length ? byCategory.map(([cat, n]) => `<div class="bar-row">
            <div class="bar-top"><span class="n">${esc(cat)}</span><span class="v">${n}</span></div>
            <div class="bar"><i class="w" style="width:${Math.round((n / maxCat) * 100)}%"></i></div></div>`).join("") : `<div class="empty"><span class="em">✨</span>No mistakes recorded yet.</div>`}
      </div>
    </div>
    ${recurring.length ? `<div class="panel" style="margin-top:22px"><h2>🔁 Patterns you keep repeating</h2>
      <p class="tiny" style="margin-bottom:16px">These are the ones worth fixing first.</p>
      ${recurring.map(r => `<div class="mistake-item">
        <span class="cat">${esc(r.category)}</span>
        <div class="body"><div class="o">${esc(r.original)}</div><div class="c">${esc(r.corrected)}</div>
          <div class="meta">Seen ${r.count}× · last ${fmtClock(r.last)}</div></div>
      </div>`).join("")}</div>` : ""}
    <div class="panel" style="margin-top:22px"><h2>🕘 Session history</h2>
      ${sessions.length ? sessions.slice(0, 20).map(s => `<div class="mistake-item">
        <span class="cat">${esc(s.scenarioName.split(" ")[0])}</span>
        <div class="body"><div style="font-weight:600;font-size:14.5px">${esc(s.scenarioName)} <span style="color:var(--dim);font-weight:500;font-size:13px">· ${esc(s.level)}</span></div>
          <div class="meta">${fmtDur(s.duration)} · ${s.turnCount} turns · ${s.wordCount} words · ${fmtClock(s.startedAt)}</div></div>
        ${s.scores ? `<div style="text-align:right"><div style="font-weight:750;font-size:16px">${s.scores.grammar}</div><div class="tiny">grammar</div></div>` : ""}
      </div>`).join("") : `<div class="empty"><span class="em">🎙️</span>No sessions yet.</div>`}
    </div>
  </div>`;
}

/* ========================= 15. MISTAKES ========================= */
let mistakeFilter = "all";
function renderMistakes() {
  const all = Repo.getMistakes();
  const cats = ["all", ...Array.from(new Set(all.map(m => m.category)))];
  const list = mistakeFilter === "all" ? all : all.filter(m => m.category === mistakeFilter);
  $("#app").innerHTML = `
  <div class="wrap">
    <div class="dash-head"><h1>Mistake history</h1>
      <p>Every correction the tutor made, with the explanation.</p></div>
    <div class="filters" style="margin-top:22px">
      ${cats.map(c => `<button class="${mistakeFilter === c ? "on" : ""}" data-cat="${esc(c)}">${c === "all" ? `All (${all.length})` : `${esc(c)} (${all.filter(m => m.category === c).length})`}</button>`).join("")}
    </div>
    <div class="panel">
      ${list.length ? list.map(m => `<div class="mistake-item">
        <span class="cat">${esc(m.category)}</span>
        <div class="body"><div class="o">${esc(m.original)}</div><div class="c">${esc(m.corrected)}</div>
          <div class="meta">${esc(m.explanation || "")} · <span style="color:${m.severity === "high" ? "var(--bad)" : m.severity === "medium" ? "var(--warn)" : "var(--dim)"}">${esc(m.severity)}</span> · ${fmtClock(m.createdAt)}</div>
        </div></div>`).join("") :
        `<div class="empty"><span class="em">✨</span>${all.length ? "No mistakes in this category." : "No mistakes recorded yet."}</div>`}
    </div>
    ${all.length ? `<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" id="practiseWeak">Practise my weak areas</button>
      <button class="btn btn-ghost" id="clearMistakes">Clear history</button></div>` : ""}
  </div>`;
  $$("[data-cat]").forEach(b => b.onclick = () => { mistakeFilter = b.dataset.cat; renderMistakes(); });
  const practiseBtn = $("#practiseWeak");
  if (practiseBtn) practiseBtn.onclick = () => {
    const weak = Stats.weakAreas();
    const map = { "Grammar": "daily", "Articles": "daily", "Preposition": "travel", "Word Choice": "office", "Vocabulary": "free", "Naturalness": "daily", "Sentence Structure": "intro", "Hindi → English": "daily", "Fluency": "free" };
    App.go(`#/tutor?scenario=${map[weak[0]] || "daily"}`);
  };
  const clearBtn = $("#clearMistakes");
  if (clearBtn) clearBtn.onclick = () => {
    if (!confirm("Delete all mistake history? This cannot be undone.")) return;
    LocalStore.state.mistakes = []; LocalStore.save();
    toast("Mistake history cleared."); renderMistakes();
  };
}

/* ========================= 16. SETTINGS ========================= */
function renderSettings() {
  const user = Repo.getUser();
  const s = Repo.getSettings();
  const voices = TextToSpeechProvider.getVoices();
  $("#app").innerHTML = `
  <div class="wrap" style="max-width:720px">
    <div class="dash-head"><h1>Settings</h1><p>Everything is stored locally in this browser.</p></div>
    <div class="panel" style="margin-top:22px"><h2>👤 Profile</h2>
      <div class="field"><label for="setName">Name</label><input id="setName" type="text" value="${esc(user.name)}" /></div>
      <div class="field"><label for="setLevel">Declared level</label>
        <select id="setLevel">${CONFIG.levels.map(l => `<option ${l === user.level ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <button class="btn btn-primary btn-sm" id="saveProfile">Save profile</button>
    </div>
    <div class="panel" style="margin-top:16px"><h2>🎙️ Voice & speech</h2>
      <div class="field"><label for="setLang">Speech recognition language</label>
        <select id="setLang">
          <option value="en-IN" ${s.sttLang === "en-IN" ? "selected" : ""}>English (India) — best for Hinglish</option>
          <option value="en-US" ${s.sttLang === "en-US" ? "selected" : ""}>English (United States)</option>
          <option value="en-GB" ${s.sttLang === "en-GB" ? "selected" : ""}>English (United Kingdom)</option>
          <option value="hi-IN" ${s.sttLang === "hi-IN" ? "selected" : ""}>Hindi (India)</option>
        </select></div>
      <div class="field"><label for="setRate">Tutor speaking speed — <span id="rateVal">${s.rate.toFixed(2)}</span>×</label>
        <input id="setRate" type="range" min="0.6" max="1.3" step="0.05" value="${s.rate}" style="width:100%" /></div>
      <div class="field"><label for="setVoice">Tutor voice</label>
        <select id="setVoice"><option value="">Automatic (best available)</option>
          ${voices.map(v => `<option value="${esc(v.voiceURI)}" ${s.voiceURI === v.voiceURI ? "selected" : ""}>${esc(v.name)} — ${esc(v.lang)}</option>`).join("")}
        </select></div>
      <div class="field"><label for="setCorrection">Correction strictness</label>
        <select id="setCorrection">${Object.entries(CONFIG.correctionModes).map(([k, v]) => `<option value="${k}" ${s.correctionMode === k ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select></div>
      <button class="btn btn-primary btn-sm" id="saveVoice">Save voice settings</button>
      <button class="btn btn-ghost btn-sm" id="testVoice" style="margin-left:8px">Test voice</button>
    </div>
    <div class="panel" style="margin-top:16px"><h2>💳 Plan</h2>
      <p style="color:var(--muted);font-size:14.5px;margin:0 0 14px">You're on the <b style="color:var(--text)">${user.plan === "pro" ? "Pro" : "Free"}</b> plan.
        ${user.plan === "free" ? `Free gives you ${CONFIG.limits.freeMinutesPerDay} minutes of speaking per day.` : "Unlimited speaking."}</p>
      ${user.plan === "free" ? `<button class="btn btn-primary btn-sm" id="upgradeBtn">Upgrade to Pro — ${CONFIG.pricing.currency}${CONFIG.pricing.pro}/${CONFIG.pricing.period}</button>` :
        `<button class="btn btn-ghost btn-sm" id="downgradeBtn">Switch back to Free</button>`}
    </div>
    <div class="panel" style="margin-top:16px"><h2>⚙️ AI provider</h2>
      <p style="color:var(--muted);font-size:14.5px;margin:0 0 10px">Currently running: <b style="color:var(--text)">${esc(Providers.ai.name)}</b></p>
      <p class="tiny">The app talks to the tutor through an <span class="mono">AIProvider</span> interface. Point it at a hosted model and everything keeps working unchanged.</p>
    </div>
    <div class="panel" style="margin-top:16px"><h2>🗑️ Data</h2>
      <p class="tiny" style="margin-bottom:14px">Your sessions, mistakes and settings all live in this browser's local storage.</p>
      <button class="btn btn-ghost btn-sm" id="signOut">Sign out</button>
      <button class="btn btn-ghost btn-sm" id="wipe" style="margin-left:8px;border-color:rgba(239,68,68,.4);color:#FCA5A5">Delete all data</button>
    </div>
  </div>`;

  $("#saveProfile").onclick = () => {
    const name = $("#setName").value.trim();
    const level = $("#setLevel").value;
    if (!name) { toast("Name can't be empty"); return; }
    Repo.setUser({ ...user, name, level }); toast("Profile saved."); renderNav();
  };
  $("#setRate").oninput = (e) => { $("#rateVal").textContent = parseFloat(e.target.value).toFixed(2); };
  $("#saveVoice").onclick = () => {
    Repo.setSettings({ sttLang: $("#setLang").value, rate: parseFloat($("#setRate").value), voiceURI: $("#setVoice").value || null, correctionMode: $("#setCorrection").value });
    toast("Voice settings saved.");
  };
  $("#testVoice").onclick = () => {
    TextToSpeechProvider.cancel();
    TextToSpeechProvider.speak("Hello! This is how I'll sound during our conversations.", { rate: parseFloat($("#setRate").value) });
  };
  const up = $("#upgradeBtn"); if (up) up.onclick = () => openCheckoutStub();
  const down = $("#downgradeBtn"); if (down) down.onclick = () => { Repo.setUser({ ...user, plan: "free" }); toast("Switched to Free plan."); renderSettings(); };
  $("#signOut").onclick = () => { Repo.clearUser(); toast("Signed out."); App.go("#/"); };
  $("#wipe").onclick = () => {
    if (!confirm("This will permanently delete all your sessions, mistakes and settings. Continue?")) return;
    LocalStore.reset(); toast("All data deleted."); App.go("#/");
  };
}

function openCheckoutStub() {
  const root = $("#modalRoot");
  root.innerHTML = `
    <div class="overlay" id="ov"><div class="modal">
      <h2>Pro plan</h2>
      <p class="sub">${CONFIG.pricing.currency}${CONFIG.pricing.pro} / ${CONFIG.pricing.period} — unlimited speaking, full analytics, personalised practice.</p>
      <div class="banner info" style="margin-bottom:18px"><span>ℹ️</span>
        <div>Payments aren't connected in this MVP. The checkout hook is in place.</div></div>
      <button class="btn btn-ghost" id="closeCheckout" style="width:100%">Close</button>
    </div></div>`;
  $("#closeCheckout").onclick = () => { root.innerHTML = ""; };
  $("#ov").onclick = (e) => { if (e.target.id === "ov") root.innerHTML = ""; };
}

/* ========================= 17. BOOT ========================= */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { TextToSpeechProvider.cancel(); SpeechToTextProvider.stop(); }
});
window.addEventListener("hashchange", () => {
  const { path } = App.parse();
  if (path !== "tutor" && App.tutorSessionActive) teardownTutor();
});
if (TextToSpeechProvider.supported) {
  setTimeout(() => TextToSpeechProvider.refresh(), 300);
  setTimeout(() => TextToSpeechProvider.refresh(), 1200);
}
App.render();
</script>
</body>
</html>
